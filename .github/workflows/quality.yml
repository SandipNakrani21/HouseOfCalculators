name: Project checks
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run package:deploy
      - run: node scripts/verify-deploy.cjs
      - name: Archive the Linux runtime (no source, tests or build cache)
        run: tar -czf calculator-release-linux-x64.tar.gz -C "dist/deploy-$(cat .next/BUILD_ID)-linux-x64" .
      - uses: actions/upload-artifact@v4
        with:
          name: calculator-release-linux-x64
          path: calculator-release-linux-x64.tar.gz
          retention-days: 3
